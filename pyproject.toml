[project]
name = "firebreak"
version = "0.1.0"
description = "Firebreak — targeted containment of compromises in supply chains"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.111",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "networkx>=3.7",
    "pypdf>=6.20.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "web3>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebreak"]

[dependency-groups]
dev = [
    "eth-tester[py-evm]>=0.14.0b1",
    "httpx2>=2.13.1",
    "py-evm>=0.12.1b1",
    "py-solc-x>=2.0.5",
    "pycryptodome>=3.24.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# safe-pysha3 (pulled in by eth-hash[pysha3]) has no Windows wheel and requires
# a Visual Studio compiler. eth-hash falls back to pycryptodome on its own.
override-dependencies = ["safe-pysha3 ; sys_platform == 'never'"]
