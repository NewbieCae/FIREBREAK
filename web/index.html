<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Firebreak — tableau de bord</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14171c; color: #e6e8eb; }
  #topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            background: #1d2129; border-bottom: 1px solid #333; flex-wrap: wrap; }
  #topbar h1 { font-size: 18px; margin: 0 12px 0 0; }
  button { background: #2f6fed; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 14px; cursor: pointer; font-size: 14px; }
  button.secondary { background: #444a55; }
  select { background: #262b34; color: #e6e8eb; border: 1px solid #444a55;
           border-radius: 6px; padding: 7px 10px; font-size: 14px; }
  button:hover { filter: brightness(1.15); }
  .counter { background: #262b34; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .counter b { color: #ff7043; }
  #main { display: flex; height: calc(100vh - 52px); }
  #cy { flex: 1; }
  #panel { width: 360px; overflow-y: auto; background: #1d2129;
           border-left: 1px solid #333; padding: 14px; font-size: 13px; }
  #panel h2 { font-size: 15px; margin: 0 0 8px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px;
         font-size: 12px; margin-right: 6px; }
  .tag.ok { background: #2e7d32; } .tag.quarantined { background: #c62828; }
  .tag.released { background: #1565c0; }
  .path li { margin: 3px 0; }
  .alert { border-bottom: 1px solid #333; padding: 6px 0; }
  .sig-ok { color: #66bb6a; } .sig-ko { color: #ef5350; }
  #panel .rem-btn { margin: 4px 6px 0 0; font-size: 12px; padding: 5px 9px; }
  .muted { color: #9aa0aa; }
  #compare { position: fixed; inset: 52px 0 0 0; background: #14171c;
             display: none; flex-direction: column; z-index: 10; }
  #compare.open { display: flex; }
  #cmp-head { text-align: center; padding: 10px 0 4px; }
  #cmp-head .big { font-size: 28px; font-weight: 700; color: #ffb300; }
  #cmp-head .sub { font-size: 14px; color: #9aa0aa; margin-top: 2px; }
  #cmp-halves { flex: 1; display: flex; min-height: 0; }
  .cmp-half { flex: 1; display: flex; flex-direction: column; min-width: 0;
              border-right: 1px solid #333; }
  .cmp-half:last-child { border-right: 0; }
  .cmp-title { text-align: center; padding: 8px 4px 2px; }
  .cmp-title h3 { margin: 0; font-size: 18px; }
  .cmp-title .muted { font-size: 12px; }
  .cmp-cy { flex: 1; min-height: 0; }
  .cmp-counters { display: flex; justify-content: center; gap: 14px;
                  flex-wrap: wrap; padding: 6px 8px 10px; }
  .cmp-stat { text-align: center; min-width: 90px; }
  .cmp-stat .v { font-size: 22px; font-weight: 700; }
  .cmp-stat .k { font-size: 11px; color: #9aa0aa; }
  .v.red { color: #e53935; } .v.orange { color: #ff9800; }
  .v.green { color: #43a047; } .v.amber { color: #ffb300; }
  #cmp-bottom { border-top: 1px solid #333; padding: 8px 16px; font-size: 13px; }
  #cmp-bench { text-align: center; color: #ffb300; margin-bottom: 6px; }
  #cmp-real { display: flex; gap: 12px; }
  .rw-card { flex: 1; background: #1d2129; border-radius: 8px; padding: 10px 12px; }
  .rw-card b { font-size: 13px; } .rw-card .date { color: #9aa0aa; font-size: 12px; }
  .rw-card p { margin: 6px 0; font-size: 12px; color: #cfd3da; }
  .rw-card a { color: #6ea8ff; font-size: 11px; }
  #cmp-close { position: absolute; top: 8px; right: 14px; }
</style>
</head>
<body>
<div id="topbar">
  <h1>🔥 Firebreak</h1>
  <select id="sel-scenario" title="Scénario"></select>
  <button id="btn-compromise">Déclarer le fournisseur compromis (depuis 14:00)</button>
  <button id="btn-withdraw" class="secondary">Retirer la déclaration (fausse alerte)</button>
  <button id="btn-replay" class="secondary">Rejouer</button>
  <button id="btn-demo" class="secondary">Démo : étape suivante →</button>
  <button id="btn-compare" class="secondary">Avec vs sans</button>
  <button id="btn-reset" class="secondary">Réinitialiser</button>
  <span class="counter" id="cnt-main">—</span>
  <span class="counter" id="cnt-gates">—</span>
  <span class="counter" id="cnt-money">—</span>
</div>
<div id="main">
  <div id="cy"></div>
  <div id="panel">
    <h2>Détail</h2>
    <div id="detail" class="muted">Cliquez sur une opération.</div>
    <h2 style="margin-top:18px">Alertes signées</h2>
    <div id="alerts" class="muted">Aucune alerte.</div>
    <h2 style="margin-top:18px">Journal d'audit</h2>
    <div id="audit" class="muted">—</div>
    <details id="chain-box" style="display:none;margin-top:18px">
      <summary><h2 style="display:inline">Avalanche</h2> <span id="chain-dot">●</span></summary>
      <div id="chain-head" class="muted"></div>
      <button id="btn-onchain" class="secondary rem-btn">Vérifier sur Avalanche</button>
      <button id="btn-rewrite" class="secondary rem-btn" style="display:none">Simuler une réécriture du journal</button>
      <div id="chain-verify"></div>
      <div id="chain-anchors" class="muted"></div>
    </details>
  </div>
</div>
<div id="compare">
  <button id="cmp-close" class="secondary">Fermer ✕</button>
  <div id="cmp-head"><div class="big" id="cmp-headline"></div><div class="sub" id="cmp-subline"></div></div>
  <div id="cmp-halves">
    <div class="cmp-half">
      <div class="cmp-title"><h3>Sans Firebreak</h3><div class="muted" id="cmp-sub-l"></div></div>
      <div class="cmp-cy" id="cyL"></div>
      <div class="cmp-counters" id="cntL"></div>
    </div>
    <div class="cmp-half">
      <div class="cmp-title"><h3>Avec Firebreak</h3><div class="muted" id="cmp-sub-r"></div></div>
      <div class="cmp-cy" id="cyR"></div>
      <div class="cmp-counters" id="cntR"></div>
    </div>
  </div>
  <div id="cmp-bottom">
    <div id="cmp-bench"></div>
    <div id="cmp-real"></div>
  </div>
</div>
<script>
const COLORS = { ok: '#43a047', quarantined: '#e53935', released: '#1e88e5' };
const COL_X = { fournisseur: 80, fabricant: 330, distributeur: 580, client: 830 };
let cy = null, state = null;

function fmtMoney(v) {
  return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(v || 0) + ' €';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setCounters(c) {
  document.getElementById('cnt-main').innerHTML =
    `<b>${c.quarantined}</b> opérations bloquées`;
  document.getElementById('cnt-gates').innerHTML =
    `<b>${c.gates_blocked}</b> actions irréversibles bloquées`;
  document.getElementById('cnt-money').innerHTML =
    `<b>${fmtMoney(c.amount_blocked)}</b> bloqués / ${fmtMoney(c.amount_flowing)} en circulation`;
}

async function api(path, method = 'GET', body = null) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : null,
  });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

let cyL = null, cyR = null;
function buildSplitCy(containerId, statusOf) {
  const rows = {};
  const elements = [];
  state.companies.forEach(c => {
    elements.push({ data: { id: 'co-' + containerId + '-' + c.id, label: c.name } });
    rows[c.id] = 0;
  });
  state.records.forEach(r => {
    const row = rows[r.company]++;
    elements.push({
      data: { id: r.id, parent: 'co-' + containerId + '-' + r.company,
              label: r.label, status: statusOf(r), gate: r.gate },
      position: { x: COL_X[r.company], y: 40 + row * 26 },
    });
  });
  state.edges.forEach(e => elements.push({
    data: { source: e.source, target: e.target, cross: e.cross },
  }));
  return cytoscape({
    container: document.getElementById(containerId),
    elements, layout: { name: 'preset' },
    userZoomingEnabled: false, userPanningEnabled: false, boxSelectionEnabled: false,
    style: [
      { selector: ':parent', style: {
          'label': 'data(label)', 'text-valign': 'top', 'font-size': 12,
          'color': '#cfd3da', 'background-opacity': 0.08, 'padding': 24 } },
      { selector: 'node[status]', style: {
          'label': 'data(label)', 'font-size': 8, 'color': '#e6e8eb',
          'text-valign': 'center', 'text-wrap': 'wrap', 'text-max-width': 110,
          'width': 22, 'height': 22, 'background-color': COLORS.ok } },
      { selector: 'node[status="quarantined"]', style: { 'background-color': COLORS.quarantined } },
      { selector: 'node[status="released"]', style: { 'background-color': COLORS.released } },
      { selector: 'node[status="coupe"]', style: { 'background-color': '#616b7a' } },
      { selector: 'node[status="coupe-contaminated"]', style: { 'background-color': '#a83232' } },
      { selector: 'node[status="leak"]', style: { 'background-color': '#ff9800',
          'border-width': 3, 'border-color': '#ffd54f', 'border-style': 'double' } },
      { selector: 'node[gate]', style: { 'shape': 'diamond', 'width': 28, 'height': 28 } },
      { selector: 'edge', style: { 'width': 1, 'line-color': '#556',
          'target-arrow-shape': 'triangle', 'target-arrow-color': '#556',
          'arrow-scale': 0.6, 'curve-style': 'bezier' } },
      { selector: 'edge[cross]', style: { 'line-style': 'dashed', 'line-color': '#8899bb',
          'target-arrow-color': '#8899bb' } },
    ],
  });
}

function cmpStat(v, k, cls) {
  return `<div class="cmp-stat"><div class="v ${cls}">${v}</div><div class="k">${k}</div></div>`;
}
function cmpCounters(m) {
  return cmpStat(m.blocked, 'opérations bloquées', 'red') +
    cmpStat(m.healthy_blocked, 'dont saines', 'orange') +
    cmpStat(m.leaked, 'fuites', 'orange') +
    cmpStat(fmtMoney(m.payments_blocked_eur), 'paiements bloqués', 'red') +
    cmpStat(fmtMoney(m.payments_flowing_eur), 'paiements qui continuent', 'green') +
    cmpStat((m.activity_preserved_pct ?? 0).toFixed(1) + ' %', 'activité saine préservée', 'amber');
}

function showCompare(d) {
  // vérité affichée ≈ bloqué-C ∪ fuites-B (C n'a pas de fuite sur le scénario)
  const truthIds = new Set(d.with.blocked_ids.concat(d.without.leaked_ids.map(l => l.id)));
  const bIds = new Set(d.without.blocked_ids);
  const leakIds = new Set(d.without.leaked_ids.map(l => l.id));
  cyL = buildSplitCy('cyL', r =>
    leakIds.has(r.id) ? 'leak'
    : bIds.has(r.id) ? (truthIds.has(r.id) ? 'coupe-contaminated' : 'coupe')
    : 'ok');
  cyR = buildSplitCy('cyR', r => r.status);
  const ratio = d.healthy_blocked_ratio;
  document.getElementById('cmp-headline').textContent =
    ratio !== null ? `${ratio.toFixed(1)}× moins d'opérations saines bloquées`
    : `Sans Firebreak : ${d.without.healthy_blocked} opérations saines bloquées ` +
      `et ${d.without.leaked} contaminées qui passent. ` +
      `Avec Firebreak : ${d.with.healthy_blocked} et ${d.with.leaked}.`;
  document.getElementById('cmp-subline').textContent =
    `Vérité terrain : ${d.truth.contaminated} opérations réellement contaminées`;
  document.getElementById('cmp-sub-l').textContent = d.without.subtitle;
  document.getElementById('cmp-sub-r').textContent = d.with.subtitle;
  document.getElementById('cntL').innerHTML = cmpCounters(d.without);
  document.getElementById('cntR').innerHTML = cmpCounters(d.with);
  const benchEl = document.getElementById('cmp-bench');
  if (d.bench && d.bench.groups && d.bench.groups['p0.0:C'] && d.bench.groups['p0.0:B']) {
    const c = d.bench.groups['p0.0:C'], b = d.bench.groups['p0.0:B'];
    benchEl.textContent = `Sur ${c.seeds} supply chains simulées : Firebreak bloque ` +
      `${c.healthy_blocked_mean.toFixed(1)} opérations saines contre ` +
      `${b.healthy_blocked_mean.toFixed(1)}, rappel ${(c.recall_mean * 100).toFixed(0)} %`;
  } else benchEl.textContent = '';
  document.getElementById('cmp-real').innerHTML = (d.real_world || []).map(rw =>
    `<div class="rw-card"><b>${rw.name}</b> <span class="date">— ${rw.date}</span>` +
    `<p>${rw.text}</p><a href="${rw.source}" target="_blank">source</a></div>`).join('');
  document.getElementById('compare').classList.add('open');
}
function hideCompare() {
  document.getElementById('compare').classList.remove('open');
  if (cyL) { cyL.destroy(); cyL = null; }
  if (cyR) { cyR.destroy(); cyR = null; }
}
document.getElementById('cmp-close').onclick = hideCompare;
document.getElementById('btn-compare').onclick = async () => {
  try { showCompare(await api('/api/compare')); }
  catch (e) { alert(e.message); }
};

function render(s) {
  state = s;
  hideCompare();
  const sel = document.getElementById('sel-scenario');
  sel.value = s.scenario.id;
  sel.title = s.scenario.description;
  const hint = s.scenario.compromise;
  document.getElementById('btn-compromise').textContent =
    `Déclarer ${hint.company} compromis (depuis ${hint.since.slice(11, 16)})`;
  const g = s.counters.global;
  document.getElementById('cnt-main').innerHTML =
    `<b>${g.quarantined}</b> opérations bloquées / ${g.ok + g.released} continuent`;
  document.getElementById('cnt-gates').innerHTML =
    `<b>${g.gates_blocked}</b> actions irréversibles bloquées`;
  document.getElementById('cnt-money').innerHTML =
    `<b>${fmtMoney(g.amount_blocked)}</b> bloqués / ${fmtMoney(g.amount_flowing)} en circulation`;

  const rows = {};
  const elements = [];
  s.companies.forEach(c => {
    elements.push({ data: { id: 'co-' + c.id, label: c.name } });
    rows[c.id] = 0;
  });
  s.records.forEach(r => {
    const row = rows[r.company]++;
    elements.push({
      data: { id: r.id, parent: 'co-' + r.company, label: r.label,
              status: r.status, gate: r.gate, record: r },
      position: { x: COL_X[r.company], y: 40 + row * 26 },
    });
  });
  s.edges.forEach(e => elements.push({
    data: { source: e.source, target: e.target, cross: e.cross },
  }));

  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    layout: { name: 'preset' },
    style: [
      { selector: ':parent', style: {
          'label': 'data(label)', 'text-valign': 'top', 'font-size': 12,
          'color': '#cfd3da', 'background-opacity': 0.08, 'padding': 24 } },
      { selector: 'node[status]', style: {
          'label': 'data(label)', 'font-size': 8, 'color': '#e6e8eb',
          'text-valign': 'center', 'text-wrap': 'wrap', 'text-max-width': 110,
          'width': 22, 'height': 22, 'background-color': COLORS.ok } },
      { selector: 'node[status="quarantined"]', style: { 'background-color': COLORS.quarantined } },
      { selector: 'node[status="released"]', style: { 'background-color': COLORS.released } },
      { selector: 'node[gate]', style: { 'shape': 'diamond', 'width': 28, 'height': 28 } },
      { selector: 'edge', style: { 'width': 1, 'line-color': '#556',
          'target-arrow-shape': 'triangle', 'target-arrow-color': '#556',
          'arrow-scale': 0.6, 'curve-style': 'bezier' } },
      { selector: 'edge[cross]', style: { 'line-style': 'dashed', 'line-color': '#8899bb',
          'target-arrow-color': '#8899bb' } },
      { selector: '.travelling', style: { 'line-color': '#ffb300',
          'target-arrow-color': '#ffb300', 'width': 3 } },
    ],
  });
  cy.on('tap', 'node[status]', evt => showDetail(evt.target.data('record')));

  const feed = document.getElementById('alerts');
  feed.innerHTML = s.alerts.length ? '' : 'Aucune alerte.';
  s.alerts.forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert';
    const kind = a.type === 'release' ? 'levée' : 'contamination';
    div.innerHTML = `<b>${kind}</b> ${a.from} → ${a.to} — ${a.tokens_count} jeton(s) — ` +
      `<span class="${a.verified ? 'sig-ok' : 'sig-ko'}">` +
      `signature ${a.verified ? 'OK' : 'REJETÉE'}</span><br>` +
      `<span class="muted">${a.issued_at}</span>`;
    feed.appendChild(div);
  });
  renderAudit();
}

async function renderAudit() {
  const v = await api('/api/audit/verify');
  document.getElementById('audit').innerHTML = v.journals.map(j =>
    `<div>${j.company} — ${j.entries} entrée(s) — ` +
    `<span class="${j.ok ? 'sig-ok' : 'sig-ko'}">` +
    `${j.ok ? 'chaîne intacte' : 'cassée à l’entrée ' + j.first_broken_index}</span></div>`
  ).join('');
}

async function showDetail(r) {
  const el = document.getElementById('detail');
  const data = await api(`/api/records/${r.id}/explain`);
  let html = `<div><b>${r.label}</b> <span class="muted">(${r.id})</span></div>
    <div style="margin:6px 0"><span class="tag ${r.status}">${r.status}</span>
    <span class="muted">${r.kind} · ${r.company} · ${r.ts.slice(11, 16)}</span></div>
    <p>${data.explanation}</p>`;
  if (data.path.length > 1) {
    html += '<div class="muted">Chemin :</div><ul class="path">' +
      data.path.map(p => `<li>${p.label}</li>`).join('') + '</ul>';
  }
  if (r.status === 'quarantined') {
    html += '<div>' + data.remediation_plan.map(p =>
      `<button class="rem-btn" data-action="${p.action}" title="${p.rationale}">${p.label}</button>`
    ).join('') + '</div>';
  }
  el.innerHTML = html;
  el.className = '';
  el.querySelectorAll('.rem-btn').forEach(btn => btn.onclick = async () => {
    render(await api(`/api/records/${r.id}/remediate`, 'POST', { action: btn.dataset.action }));
  });
}

document.getElementById('btn-compromise').onclick = async () => {
  render(await api('/api/compromise', 'POST', state.scenario.compromise));
};
document.getElementById('btn-withdraw').onclick = async () => {
  try {
    render(await api('/api/compromise/withdraw', 'POST',
      { company: state.scenario.compromise.company }));
  } catch (e) { alert(e.message); }
};
let replaying = false;
async function replay() {
  if (replaying) return;
  replaying = true;
  try {
    const { steps } = await api('/api/timeline');
    if (!steps.length || !cy) return;
    cy.nodes('[status="quarantined"]').forEach(n => n.data('status', 'ok'));
    const feed = document.getElementById('alerts');
    feed.innerHTML = '';
    for (const st of steps) {
      if (st.record) {
        const n = cy.getElementById(st.record);
        if (n.nonempty()) {
          if (['seed', 'quarantine', 'gate_blocked'].includes(st.type))
            n.data('status', 'quarantined');
          else if (st.type === 'release') n.data('status', 'ok');
          else if (st.type === 'remediation') n.data('status', 'released');
        }
      }
      if (st.alert && st.alert.links) {
        st.alert.links.forEach(([s, t]) => {
          const e = cy.edges().filter(ed =>
            ed.source().id() === s && ed.target().id() === t)[0];
          if (e) { e.addClass('travelling'); setTimeout(() => e.removeClass('travelling'), 700); }
        });
        const div = document.createElement('div');
        div.className = 'alert';
        div.innerHTML = `${st.alert.from} → ${st.alert.to} — ${st.alert.tokens_count} jeton(s)`;
        feed.prepend(div);
      }
      if (st.counters) setCounters(st.counters);
      const det = document.getElementById('detail');
      det.className = ''; det.innerHTML = `<b>Étape ${st.n}</b> — ${st.text}`;
      await sleep(500);
    }
  } finally { replaying = false; }
}
document.getElementById('btn-replay').onclick = replay;
async function demoNext() {
  const r = await api('/api/demo/step', 'POST', {});
  if (r.state) render(r.state);
  if (r.detail && r.detail.without && r.detail.with) showCompare(r.detail);
  const det = document.getElementById('detail');
  det.className = '';
  let html = `<b>Démo — étape ${r.step + 1}/${r.total}</b><p>${r.caption}</p>`;
  if (r.error) html += `<p class="sig-ko">${r.error}</p>`;
  if (r.detail && r.detail.explanation)
    html += `<p>${r.detail.explanation}</p>`;
  else if (r.detail && typeof r.detail === 'object' && r.detail.ok !== undefined)
    html += `<p>Journaux : <span class="${r.detail.ok ? 'sig-ok' : 'sig-ko'}">` +
            `${r.detail.ok ? 'intègres' : 'cassés'}</span></p>`;
  det.innerHTML = html;
}
document.getElementById('btn-demo').onclick = demoNext;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !e.target.closest('input,select,textarea'))
    demoNext();
});
document.getElementById('btn-reset').onclick = async () => {
  render(await api('/api/reset', 'POST', { scenario: state.scenario.id }));
};
document.getElementById('sel-scenario').onchange = async (e) => {
  render(await api('/api/reset', 'POST', { scenario: e.target.value }));
};
api('/api/scenarios').then(list => {
  document.getElementById('sel-scenario').innerHTML = list.map(sc =>
    `<option value="${sc.id}">${sc.label}</option>`).join('');
  return api('/api/state');
}).then(render).catch(e => alert(e.message));

// --- Panneau Avalanche : visible seulement si la chaîne est active ---
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = h => h ? h.slice(0, 8) + '…' + h.slice(-4) : '—';
const STATUS_COLOR = { confirmed: '#66bb6a', sent: '#ffb300', pending: '#9aa0aa', failed: '#ef5350' };
const KIND_ICON = { audit: '📒', alert: '✉️', ack: '✅', incident: '🚨' };
let chainOn = false;

async function refreshChain() {
  let st;
  try { st = await api('/api/chain/status'); } catch { return; }
  chainOn = st.mode !== 'off';
  const box = document.getElementById('chain-box');
  box.style.display = chainOn ? '' : 'none';
  if (!chainOn) return;
  document.getElementById('chain-dot').style.color = st.connected ? '#66bb6a' : '#ef5350';
  const q = st.queue;
  document.getElementById('chain-head').innerHTML =
    `mode ${esc(st.mode)} — ${st.connected ? 'connectée' : 'injoignable'}` +
    (st.chain_id ? ` — chainId ${st.chain_id}` : '') +
    (st.contract ? `<br>contrat <code>${esc(short(st.contract))}</code>` : '') +
    `<br>run <code>${esc(short(st.run_id))}</code> — ` +
    `${q.confirmed} confirmé(s), ${q.pending + q.sent} en cours, ${q.failed} échec(s)`;
  if (!box.open) return;
  const anchors = await api('/api/chain/anchors');
  document.getElementById('chain-anchors').innerHTML = anchors.slice(-30).reverse().map(a =>
    `<div class="alert">${KIND_ICON[a.kind] || ''} ${esc(a.kind)} · ${esc(a.company)} · ` +
    `<code>${esc(short(a.hash))}</code> <span style="color:${STATUS_COLOR[a.status] || '#9aa0aa'}">` +
    `${esc(a.status)}${a.block ? ' · bloc ' + a.block : ''}</span>` +
    (a.explorer_link ? ` <a href="${esc(a.explorer_link)}" target="_blank" rel="noopener">tx</a>` : '') +
    (a.error ? `<br><span class="sig-ko">${esc(a.error)}</span>` : '') + `</div>`).join('') || 'Aucun ancrage.';
}

function showOnchain(v) {
  const mark = ok => `<span class="${ok ? 'sig-ok' : 'sig-ko'}">${ok ? '✓' : '✗'}</span>`;
  document.getElementById('chain-verify').innerHTML = v.journals.map(j =>
    `<div>${esc(j.company)} — local ${mark(j.ok)} — Avalanche ` +
    (j.onchain && j.onchain.unreadable ? '<span class="muted">lecture impossible, réessayer</span>' :
     j.onchain ? `${mark(j.onchain.matches)} (${j.onchain.anchored_entries} entrées` +
      `${j.onchain.block ? ', bloc ' + j.onchain.block : ''})` : '<span class="muted">non ancré</span>') +
    `</div>`).join('') +
    (v.onchain_ok === false ? '<b class="sig-ko">Le journal ne correspond plus à ce qui a été ancré.</b>' : '');
}

document.getElementById('btn-onchain').onclick = async () => {
  try {
    await api('/api/chain/anchor', 'POST', {});
    showOnchain(await api('/api/audit/verify'));
  } catch (e) { alert(e.message); }
};
document.getElementById('btn-rewrite').onclick = async () => {
  try {
    const r = await api('/api/demo/rewrite', 'POST', { company: 'fabricant', drop_event: 'alert_received' });
    showOnchain(r.verify);
  } catch (e) { alert(e.message); }
};
document.getElementById('chain-box').addEventListener('toggle', refreshChain);
refreshChain().then(() => { if (chainOn) document.getElementById('btn-rewrite').style.display = ''; });
setInterval(refreshChain, 2000);
</script>
</body>
</html>
